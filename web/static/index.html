<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PersDataGate</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><h1>PersDataGate</h1><span>Локальная псевдонимизация перед отправкой</span></header>
<main><section class="inputs"><label>Промпт<textarea id="prompt" rows="5" placeholder="Что нужно сделать с документом?"></textarea></label><label>Документ<textarea id="document" rows="18" placeholder="Вставьте текст документа"></textarea></label><button id="process">Псевдонимизировать и отправить</button><p id="status" role="status"></p></section>
<section class="outputs"><article><div class="title"><h2>Запрос в OpenAI</h2><button data-copy="request">Копировать</button></div><pre id="request" class="empty">Здесь появятся инструкции и текст запроса.</pre></article>
<article><div class="title"><h2>Ответ OpenAI</h2><button data-copy="answer">Копировать</button></div><nav><button class="tab active" data-tab="received">Полученный</button><button class="tab" data-tab="restored">Восстановленный</button></nav><pre id="received" class="empty">Здесь появится ответ.</pre><pre id="restored" class="empty hidden">Здесь появится восстановленный ответ.</pre><p id="warnings"></p></article></section></main><script src="/static/app.js" defer></script></body></html>
