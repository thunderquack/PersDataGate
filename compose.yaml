name: persdatagate

services:
  pseudonymizer:
    image: persdatagate-pseudonymizer:cuda
    build:
      context: .
      dockerfile: pseudonymizer/Dockerfile
      args:
        DEVICE: cuda
    gpus: all
    environment:
      DEVICE: cuda
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen/Qwen3-1.7B}
      PIPELINE_LOG_DIR: /pipeline-logs
      PIPELINE_SERVICE: pseudonymizer
      HF_HOME: /models/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_XET_HIGH_PERFORMANCE: "1"
    volumes:
      - model-cache:/models
      - ./logs/pipelines:/pipeline-logs
      - ./pseudonymizer/requirements.txt:/app/pseudonymizer/requirements.txt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 120m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8000"
    environment:
      PSEUDONYMIZER_URL: http://pseudonymizer:8000
      PIPELINE_LOG_DIR: /pipeline-logs
      PIPELINE_SERVICE: web
      PSEUDONYMIZER_TIMEOUT_SECONDS: ${PSEUDONYMIZER_TIMEOUT_SECONDS:-600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - ./logs/pipelines:/pipeline-logs
    depends_on:
      pseudonymizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
    restart: unless-stopped

volumes:
  model-cache:
